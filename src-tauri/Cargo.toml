[package]
name = "pixvox"
version = "1.0.0"
description = "PixVox - Pixel Art to 3D Voxels"
authors = ["PixVox Contributors"]
license = "PixVox Hybrid License (BSL 1.1 + MIT)"
repository = "https://github.com/PetRockStudiosLLC/pixvox"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
